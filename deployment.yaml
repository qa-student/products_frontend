
# ---------------------------------------------------------
# Deployment
# ---------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: products-microservice
  labels:
    app: frontend
spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: frontend
          image: {{.Values.image}}
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: ENVIRONMENT
              value: "production"

          # -------------------------------------------------
          # Health Probe
          # -------------------------------------------------

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3

          # -------------------------------------------------
          # Readiness Probe
          # -------------------------------------------------

          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # -------------------------------------------------
          # Startup Probe
          # -------------------------------------------------

          startupProbe:
            httpGet:
              path: /ready
              port: 80
            failureThreshold: 30
            periodSeconds: 5

          # -------------------------------------------------
          # Graceful Shutdown
          # -------------------------------------------------

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

---

apiVersion: v1
kind: Service
metadata:
    name: frontend-service
    namespace: products-microservice
    labels:
      app: frontend
spec:
    ports:
      - name: http
        port: 80
        targetPort: 80
        protocol: TCP
    selector:
      app: frontend
    type: LoadBalancer
---


# ---------------------------------------------------------
# Horizontal Pod Autoscaler
# ---------------------------------------------------------

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: products-microservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

---

# ---------------------------------------------------------
# Pod Disruption Budget
# ---------------------------------------------------------

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: products-microservice
spec:
  minAvailable: 2

  selector:
    matchLabels:
      app: frontend